[package]
name = "claude-bell"
version = "0.1.0"
edition = "2021"
description = "macOS notifications for Claude Code"
license = "MIT"
repository = "https://github.com/aaronbassett/claude-bell"
keywords = ["cli", "notifications", "macos", "claude"]
categories = ["command-line-utilities"]

[[bin]]
name = "cb"
path = "src/main.rs"

[[bin]]
name = "claude-bell"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
dirs = "5"
tera = "1"
sha2 = "0.10"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["all"] }
block2 = "0.5"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
